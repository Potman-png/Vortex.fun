<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid #15ff00;
            background-color: #111;
        }

        .info {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 14px;
            color: #ddd;
        }
    </style>
</head>
<body>
<div class="info">Use arrow keys to move. Press Enter to restart.</div>
<canvas width="400" height="400" id="game" aria-label="Snake game"></canvas>
<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');

const tileCount = 20;
const tileSize = canvas.width / tileCount;

let snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
];

let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
const speed = 120;

function drawBoard() {
    context.fillStyle = '#111';
    context.fillRect(0, 0, canvas.width, canvas.height);

    context.strokeStyle = '#1d1d1d';
    context.lineWidth = 1;

    for (let i = 0; i < tileCount; i++) {
        context.beginPath();
        context.moveTo(i * tileSize, 0);
        context.lineTo(i * tileSize, canvas.height);
        context.stroke();

        context.beginPath();
        context.moveTo(0, i * tileSize);
        context.lineTo(canvas.width, i * tileSize);
        context.stroke();
    }
}

function drawSnake() {
    snake.forEach((segment, index) => {
        context.fillStyle = index === 0 ? '#7dff67' : '#42d63a';
        context.fillRect(
            segment.x * tileSize + 1,
            segment.y * tileSize + 1,
            tileSize - 2,
            tileSize - 2
        );
    });
}

function moveSnake() {
    direction = nextDirection;

    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    snake.unshift(head);
    snake.pop();

    if (snake[0].x < 0) snake[0].x = tileCount - 1;
    if (snake[0].x >= tileCount) snake[0].x = 0;
    if (snake[0].y < 0) snake[0].y = tileCount - 1;
    if (snake[0].y >= tileCount) snake[0].y = 0;
}

function updateGame() {
    moveSnake();
    drawBoard();
    drawSnake();
}

function handleKeydown(event) {
    const keyMap = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
    };

    const next = keyMap[event.key];
    if (!next) return;

    const isReverseMove =
        next.x === -direction.x && next.y === -direction.y;

    if (!isReverseMove) {
        nextDirection = next;
    }
}

document.addEventListener('keydown', handleKeydown);

drawBoard();
drawSnake();
setInterval(updateGame, speed);
</script>
</body>
</html>
